<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; padding: 24px; line-height: 1.55; }
    main { max-width: 880px; margin: 0 auto; }
    header { opacity: .65; font-size: 12px; margin-bottom: 12px; }
    article { border: 1px solid color-mix(in oklab, CanvasText 16%, Canvas); border-radius: 12px; padding: 20px; }
    pre { overflow: auto; padding: 12px; border-radius: 8px; background: color-mix(in oklab, CanvasText 8%, Canvas); }
  </style>
</head>
<body>
  <main>
    <header>pi /talk · static html · {{styleId}}</header>
    <article>{{content}}</article>
  </main>
</body>
</html>
