<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Paper · 长文批注阅读</title>
<style>
:root{--bg:#f7f6f2;--panel:#fffdfa;--ink:#24211b;--mut:#7a7265;--line:#e2ded4;--acc:#2f5061;--claim:#4f5ef0;--method:#2e9e6b;--number:#d97706;--verify:#b4479a;--shadow:0 1px 2px rgba(60,40,20,.05),0 10px 28px rgba(60,40,20,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.pp-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;padding:18px;max-width:1280px;margin:0 auto;height:100vh}
@media(max-width:860px){.pp-wrap{grid-template-columns:1fr;height:auto}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.pp-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:#5a5347}
.pp-bar .hint{color:var(--mut);font-weight:400;margin-left:auto;font-size:11.5px}
.pp-src{position:relative}
#pp-text{padding:16px 20px;overflow:auto;flex:1;font-size:14.5px}
#pp-text p{margin:0 0 12px}
.hl{border-radius:3px;cursor:pointer;padding:0 1px}
.hl.claim{background:rgba(79,94,240,.16);border-bottom:2px solid var(--claim)}
.hl.method{background:rgba(46,158,107,.16);border-bottom:2px solid var(--method)}
.hl.number{background:rgba(217,119,6,.16);border-bottom:2px solid var(--number)}
.hl.verify{background:rgba(180,71,154,.16);border-bottom:2px solid var(--verify)}
.hl.dim{opacity:.15}
.pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:300px}
.pop button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font:inherit;font-size:11.5px;cursor:pointer}
.pop button:hover{border-color:var(--acc);color:var(--acc)}
.pp-side{overflow:hidden}
#pp-filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-size:11.5px;cursor:pointer;background:#fff;user-select:none;color:#5a5347}
.chip.on{background:#eef0fb;border-color:#c7cdf2;color:var(--acc)}
#pp-list{overflow:auto;flex:1;padding:12px 14px}
.pp-empty{color:var(--mut);font-size:12.5px;text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:10px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;font-size:12.5px;background:#fff;box-shadow:0 1px 2px rgba(60,40,20,.04)}
.pcard.hide{display:none}
.pcard .q{color:#3d3830;margin:6px 0 8px;line-height:1.55}
.pcard .acts{display:flex;gap:5px;flex-wrap:wrap}
.pcard .acts button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font:inherit;font-size:11px;cursor:pointer;color:#5a5347}
.pcard .acts button:hover{border-color:var(--acc);color:var(--acc)}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:600;color:#fff}
#pp-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#2b2722;color:#f2efe8;padding:8px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#pp-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="pp-wrap">
  <div class="panel pp-src">
    <div class="pp-bar">原文<span class="hint">✎ 划选一段文字，选类别生成主张卡</span></div>
    <div id="pp-text">{{content}}</div>
  </div>
  <div class="panel pp-side">
    <div class="pp-bar">主张卡<span class="hint">talkSend · paper.*</span></div>
    <div id="pp-filters"></div>
    <div id="pp-list"><div class="pp-empty">划选左侧原文，选一个类别 → 生成主张卡</div></div>
  </div>
</div>
<div id="pp-toast"></div>
<script>
(function(){
  const $=(s,e)=>(e||document).querySelector(s);
  const $$=(s,e)=>[...(e||document).querySelectorAll(s)];
  const cats={claim:['#4f5ef0','主张'],method:['#2e9e6b','方法'],number:['#d97706','数字'],verify:['#b4479a','待核']};
  const toast=msg=>{const t=$('#pp-toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200);};
  const send=(type,payload)=>{ if(window.talkSend) window.talkSend(type,payload||{}); };
  const list=[];
  ['all','claim','method','number','verify'].forEach(f=>{
    const c=document.createElement('span'); c.className='chip'+(f==='all'?' on':''); c.dataset.f=f;
    c.textContent=f==='all'?'全部':cats[f][1];
    c.onclick=()=>{ $$('#pp-filters .chip').forEach(x=>x.classList.toggle('on',x===c)); renderList(); };
    $('#pp-filters').appendChild(c);
  });
  function renderList(){
    const cur=$('#pp-filters .chip.on').dataset.f;
    $$('#pp-list .pcard').forEach(c=>c.classList.toggle('hide',cur!=='all'&&c.dataset.cat!==cur));
    $$('#pp-text .hl').forEach(h=>h.classList.toggle('dim',cur!=='all'&&h.classList.contains(cur)===false));
    if(!list.length) $('#pp-list').innerHTML='<div class="pp-empty">划选左侧原文，选一个类别 → 生成主张卡</div>';
  }
  const src=$('#pp-text');
  if(!src.textContent.trim()){ src.innerHTML='<div class="pp-empty">content 为空 — 请用 talk_render({styleId:"paper", content:"原文 HTML"}) 传入文献/文档。</div>'; }
  const pop=document.createElement('div'); pop.className='pop'; pop.style.display='none';
  src.parentElement.appendChild(pop);
  Object.entries(cats).forEach(([k,[c,lab]])=>{
    const b=document.createElement('button'); b.style.cssText='border-color:'+c+';color:'+c; b.textContent=lab;
    b.onclick=()=>{ const sel=getSelection(); const r=sel.rangeCount?sel.getRangeAt(0):null;
      if(!r||r.collapsed){ toast('请先划选一段文字'); pop.style.display='none'; return; }
      const quote=r.toString().trim().slice(0,200); if(!quote) return;
      const spans=highlightRange(r,k); sel.removeAllRanges();
      addCard(k,quote,spans); pop.style.display='none';
      send('paper.claim',{action:'highlight',category:k,quote});
      toast('已生成「'+cats[k][1]+'」主张卡 · paper.claim');
    };
    pop.appendChild(b);
  });
  const cancel=document.createElement('button'); cancel.textContent='✕'; cancel.onclick=()=>pop.style.display='none'; pop.appendChild(cancel);
  src.addEventListener('mouseup',()=>{
    setTimeout(()=>{ const sel=getSelection(); const r=sel.rangeCount?sel.getRangeAt(0):null;
      if(!r||r.collapsed){ pop.style.display='none'; return; }
      const rect=r.getBoundingClientRect(); const pr=src.getBoundingClientRect();
      pop.style.display='flex';
      pop.style.left=Math.min(Math.max(rect.left-pr.left+rect.width/2-110,4),pr.width-260)+'px';
      pop.style.top=(rect.bottom-pr.top+8)+'px';
      if(rect.bottom-pr.top+70>pr.height) pop.style.top=Math.max(rect.top-pr.top-56,4)+'px';
    },10);
  });
  document.addEventListener('mousedown',e=>{ if(pop.style.display!=='none'&&!pop.contains(e.target)) pop.style.display='none'; });
  function highlightRange(range,cls){
    const spans=[]; const ws=[]; const w=document.createTreeWalker(src,NodeFilter.SHOW_TEXT);
    let n=w.nextNode();
    while(n){ if(n.nodeType===3 && range.intersectsNode(n)) ws.push(n); n=w.nextNode(); }
    ws.forEach(tn=>{
      const s=(tn===range.startContainer)?range.startOffset:0;
      const e=(tn===range.endContainer)?range.endOffset:tn.textContent.length;
      const pre=tn.textContent.slice(0,s), mid=tn.textContent.slice(s,e), post=tn.textContent.slice(e);
      if(!mid) return;
      const sp=document.createElement('span'); sp.className='hl '+cls; sp.textContent=mid;
      const postT=document.createTextNode(post); tn.textContent=pre;
      tn.parentNode.insertBefore(sp,tn.nextSibling); sp.parentNode.insertBefore(postT,sp.nextSibling);
      spans.push(sp);
    });
    return spans;
  }
  function addCard(cat,quote,spans){
    const id='pc'+Date.now(); list.push({id,cat,quote,spans});
    const card=document.createElement('div'); card.className='pcard'; card.dataset.cat=cat;
    card.innerHTML='<div style="display:flex;gap:6px;align-items:center"><span class="tag" style="background:'+cats[cat][0]+'">'+cats[cat][1]+'</span><span style="margin-left:auto;color:var(--mut);font-size:10.5px">'+(quote.length>64?quote.slice(0,64)+'…':quote)+'</span></div>';
    const q=document.createElement('div'); q.className='q'; q.textContent='“'+quote+'”'; card.appendChild(q);
    const acts=document.createElement('div'); acts.className='acts';
    [['找反证','find_counterevidence'],['补引用','cite'],['删除','delete']].forEach(([lab,act])=>{
      const b=document.createElement('button'); b.textContent=lab;
      b.onclick=()=>{ if(act==='delete'){
          const it=list.find(x=>x.id===id);
          it.spans.forEach(s=>{ const p=s.parentNode; const txt=document.createTextNode(s.textContent); p.insertBefore(txt,s); p.removeChild(s); });
          list.splice(list.indexOf(it),1); card.remove(); renderList(); toast('已删除该主张卡');
        } else { send('paper.claim',{action:act,category:cat,quote}); toast('已回传 agent：'+lab); } };
      acts.appendChild(b);
    });
    card.appendChild(acts);
    const empty=$('#pp-list .pp-empty'); if(empty) empty.remove();
    $('#pp-list').prepend(card);
    renderList();
  }
  renderList();
})();
</script>
</body>
</html>
