<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>talk · 10 个值得加的新交互 · 原型演示</title>
<style>
:root{--bg:#f4f3ef;--panel:#fffdfa;--ink:#23262e;--mut:#8a8f98;--line:#e5e2da;--acc:#4f5ef0;--grn:#2e9e6b;--amb:#d97706;--red:#d64545;--vio:#b4479a;--shadow:0 1px 2px rgba(20,20,30,.05),0 10px 28px rgba(20,20,30,.07)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.55 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
.rail{width:228px;flex:none;background:#1d2027;color:#cfd3dc;display:flex;flex-direction:column}
.rail .brand{padding:16px 16px 10px;font-weight:700;color:#fff;font-size:13.5px;letter-spacing:.02em}
.rail .brand small{display:block;color:#7d8494;font-weight:400;font-size:11px;margin-top:2px}
.rnav{flex:1;overflow:auto;padding:4px 8px 14px}
.rnav .item{display:flex;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;margin-bottom:2px}
.rnav .item:hover{background:#272b34}
.rnav .item.on{background:#33384a}
.rnav .num{font:11px ui-monospace,Menlo,monospace;color:#7d8494;width:20px;flex:none;padding-top:1px}
.rnav .item.on .num{color:#aeb6ff}
.rnav .nm{font-size:13px;font-weight:600}
.rnav .item.on .nm{color:#fff}
.rnav .tag{font-size:10.5px;color:#6f7686;display:block;margin-top:1px;line-height:1.4}
.rnav .item.on .tag{color:#9aa1b0}
.rfoot{padding:8px 14px 14px;border-top:1px solid #262b35;font-size:11.5px}
.rfoot a{color:#8fa0b5;text-decoration:none}
.rfoot a:hover{color:#c9d4e3}
.main{flex:1;overflow:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(244,243,239,.93);backdrop-filter:blur(6px);padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:15px;margin:0;font-weight:700}
.topbar .sub{font-size:12px;color:var(--mut)}
.badge{margin-left:auto;font-size:11px;color:var(--acc);border:1px solid #c9cffb;background:#eef0fe;padding:3px 10px;border-radius:999px}
.content{flex:1;padding:22px;max-width:1200px;width:100%;margin:0 auto}
.demo{display:none}
.demo.on{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.demo-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.demo-num{font:700 20px ui-monospace,Menlo,monospace;color:var(--acc);background:#eef0fe;border:1px solid #d8dcfb;border-radius:10px;padding:7px 11px;line-height:1}
.demo-head h2{margin:0;font-size:17px}
.demo-head .sub{margin:3px 0 0;color:var(--mut);font-size:12.5px;max-width:900px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.panel-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#5b6270;margin-bottom:10px}
.panel-title .hint{color:var(--mut);font-weight:400;margin-left:auto}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.grid2b{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:980px){.grid2,.grid2b,.grid3,.grid4{grid-template-columns:1fr}}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.acc:hover{background:#3d4cdd;color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.danger{color:#b33737}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:#eef0fe;border-color:var(--acc);color:var(--acc)}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:600;color:#fff}
.pre{background:#171a21;color:#c9d4e3;border-radius:10px;padding:12px;font:11.5px/1.6 ui-monospace,Menlo,monospace;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
.pre.mini{font-size:11px;max-height:130px}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:#faf9f5;font-size:11.5px;color:#5b6270;user-select:none}
.empty{color:var(--mut);font-size:12px;text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(22,24,32,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:min(620px,92vw);max-height:84vh;overflow:auto;padding:18px 20px;position:relative}
.modal .box h3{margin:0 0 10px;font-size:15px}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:15px;cursor:pointer;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#23262e;color:#f2f4f8;padding:8px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#evd{position:fixed;right:14px;bottom:14px;width:336px;max-height:42vh;background:#171a21;color:#b8c2d0;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:40;font-size:11px;overflow:hidden;border:1px solid #262b35}
#evd.hide{display:none}
#evd .hd{padding:9px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #262b35;cursor:pointer;user-select:none}
#evd .hd b{color:#dfe6f0;font-size:12px}
#evd .hd .cnt{margin-left:auto;background:#262b35;border-radius:999px;padding:1px 8px;color:#8fa0b5;font-family:ui-monospace,Menlo,monospace}
#evd .hd .clr{color:#6f7686;cursor:pointer}
#evd .hd .clr:hover{color:#c9d4e3}
#evd .body{overflow:auto;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;line-height:1.55}
#evd .line{color:#8fa0b5;border-bottom:1px dashed #232833;padding:2px 0}
#evd .line b{color:#6ee7b7;font-weight:600}
#evdbtn{position:fixed;right:14px;bottom:14px;z-index:45;appearance:none;border:1px solid #2b3140;background:#23262e;color:#dfe6f0;border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:7px;align-items:center}
#evdbtn:hover{background:#2c3140}
#evdbtn .cnt{background:#4f5ef0;border-radius:999px;padding:0 7px;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;line-height:1.6}
#evd .hd .x{color:#6f7686;cursor:pointer}
#evd .hd .x:hover{color:#c9d4e3}
</style>
</head>
<body>
<aside class="rail">
  <div class="brand">talk packs<small>10 个值得加的新交互 · 原型</small></div>
  <nav class="rnav" id="rnav"></nav>
  <div class="rfoot" id="rfoot"></div>
</aside>
<div class="main">
  <div class="topbar">
    <h1>talk · 新交互 pack 原型 ×10</h1>
    <span class="sub">每个 demo 都可真实操作 · 右下角 ⚡ 查看 talkSend 事件回传</span>
    <span class="badge">hub · html-js 原型演示</span>
  </div>
  <div class="content" id="content">{{content}}</div>
</div>
<div id="toast"></div>
<button id="evdbtn" title="talkSend 事件回传">⚡<span class="cnt">0</span></button>
<div id="evd" class="hide">
  <div class="hd"><b>talkSend 事件回传</b><span class="cnt">0</span><span class="clr">清空</span><span class="x">✕</span></div>
  <div class="body"><div class="line">等待交互…</div></div>
</div>
<script>
(function(){
  window.$=(s,e)=>(e||document).querySelector(s);
  window.$$=(s,e)=>[...(e||document).querySelectorAll(s)];
  window.Demos={};
  function evdShow(show){
    $('#evd').classList.toggle('hide',!show);
    $('#evdbtn').style.display=show?'none':'';
  }
  window.send=function(type,payload){
    try{
      const t=new Date().toTimeString().slice(0,8);
      const b=$('#evd .body');
      if(b){
        const d=document.createElement('div'); d.className='line';
        d.innerHTML='<b>'+type+'</b> '+JSON.stringify(payload||{});
        b.prepend(d);
        while(b.children.length>40) b.lastChild.remove();
      }
      const n=(b?b.children.length:0);
      const c1=$('#evd .hd .cnt'), c2=$('#evdbtn .cnt');
      if(c1) c1.textContent=n; if(c2) c2.textContent=n;
      if(window.talkSend) window.talkSend(type,payload||{});
    }catch(e){console.warn('send failed',e);}
  };
  window.toast=function(msg){
    const t=$('#toast'); t.textContent=msg; t.classList.add('on');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200);
  };
  window.modal=function(html){
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML='<div class="box"><button class="x" aria-label="close">✕</button>'+html+'</div>';
    m.querySelector('.x').onclick=()=>m.remove();
    m.addEventListener('mousedown',e=>{if(e.target===m)m.remove();});
    document.body.appendChild(m);
    return m;
  };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=document.querySelector('.modal'); if(m) m.remove(); } });
  function boot(){
    const ns=$('#nav-src');
    if(ns){ $('#rnav').innerHTML=ns.innerHTML; ns.remove(); }
    const rs=$('#rfoot-src');
    if(rs){ $('#rfoot').innerHTML=rs.innerHTML; rs.remove(); }
    $$('.rnav .item').forEach(it=>{
      if(it._b) return; it._b=1;
      it.addEventListener('click',()=>{
        $$('.rnav .item').forEach(x=>x.classList.toggle('on',x===it));
        $$('.demo').forEach(s=>s.classList.toggle('on',s.id==='d-'+it.dataset.id));
      });
    });
    const eb=$('#evdbtn');
    if(eb&&!eb._b){ eb._b=1; eb.addEventListener('click',()=>evdShow(true)); }
    const hd=$('#evd .hd');
    if(hd&&!hd._b){ hd._b=1; hd.addEventListener('click',e=>{
      if(e.target.classList.contains('clr')){ $('#evd .body').innerHTML=''; $('#evd .hd .cnt').textContent='0'; $('#evdbtn .cnt').textContent='0'; return; }
      if(e.target.classList.contains('x')){ evdShow(false); return; }
      evdShow(false);
    });}
    Object.values(window.Demos).forEach(f=>{try{f();}catch(e){console.warn('demo init',e);}});
  }
  window.addEventListener('DOMContentLoaded',boot);
  window.addEventListener('talk:patched',boot);
  setTimeout(boot,1500);
})();
</script><script>
try{
window.$=(s,e)=>(e||document).querySelector(s);
window.$$=(s,e)=>[...(e||document).querySelectorAll(s)];
Demos.a2ui=function(){
const root=$('#d-a2ui'); if(!root||root.dataset.bound) return; root.dataset.bound=1;
const blueprints=[
{kind:'form',title:'检索阈值调参',items:[
{type:'slider',name:'threshold',label:'阈值',min:0.1,max:0.9,step:0.05,value:0.6},
{type:'select',name:'model',label:'评测模型',options:['gpt-4o','claude-sonnet','qwen-max'],value:'claude-sonnet'},
{type:'toggle',name:'strict',label:'严格模式（拒绝未知）',value:true},

{kind:'form',title:'发布审批',items:[

{type:'select',name:'prio',label:'优先级',options:['P0 紧急','P1 高','P2 常规'],value:'P1 高'},

{type:'button',name:'submit',label:'提交审批',action:'approval.submit'}]},

let idx=0;
function collect(){ const o={}; root.querySelectorAll('[data-a2ui-name]').forEach(el=>{
if(el.tagName==='INPUT'&&el.type==='checkbox') o[el.dataset.a2uiName]=el.checked;
else if(el.tagName==='INPUT') o[el.dataset.a2uiName]=el.value;

function render(bp){

else if(it.type==='badge'){ const t=document.createElement('span'); t.className='tag'; t.style.background='var(--acc)'; t.textContent=it.label; row.appendChild(t); }
else {
const lab=document.createElement('label'); lab.style.cssText='font-size:12.5px;color:#5b6270;width:150px;flex:none'; lab.textContent=it.label; row.appendChild(lab);
if(it.type==='slider'){ const i=document.createElement('input'); i.type='range'; i.min=it.min;i.max=it.max;i.step=it.step;i.value=it.value; i.dataset.a2uiName=it.name;
const v=document.createElement('b'); v.style.cssText='font:12px ui-monospace,monospace;min-width:34px'; v.textContent=it.value;

else if(it.type==='toggle'){ const c=document.createElement('input'); c.type='checkbox'; c.checked=it.value; c.dataset.a2uiName=it.name; row.appendChild(c); }
else if(it.type==='text'){ const i=document.createElement('input'); i.placeholder=it.placeholder||''; i.value=it.value||''; i.dataset.a2uiName=it.name; i.style.cssText='font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;flex:1;max-width:260px'; row.appendChild(i); }

f.appendChild(row);

host.appendChild(f);
}
render(blueprints[0]);
$('#a2ui-next').onclick=()=>{ idx=(idx+1)%blueprints.length; render(blueprints[idx]); send('a2ui.blueprint',{title:blueprints[idx].title}); };
};
Demos.paper=function(){
const root=$('#d-paper'); if(!root||root.dataset.bound) return; root.dataset.bound=1;
const cats={claim:['#4f5ef0','主张'],method:['#2e9e6b','方法'],number:['#d97706','数字'],verify:['#b4479a','待核']};
const st=document.createElement('style');
st.textContent=Object.entries(cats).map(([k,[c]])=>'.hl.'+k+'{background:'+c+'22;border-bottom:2px solid '+c+';border-radius:3px;cursor:pointer}').join('\n')+'.hl.dim{opacity:.18}.pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:300px}.pcard.hide{display:none}';
document.head.appendChild(st);
const list=[];
['all','claim','method','number','verify'].forEach(f=>{ const c=document.createElement('span'); c.className='chip'+(f==='all'?' on':''); c.dataset.f=f; c.textContent=f==='all'?'全部':cats[f][1];
c.onclick=()=>{ $$('#paper-filters .chip').forEach(x=>x.classList.toggle('on',x===c)); renderList(); };
$('#paper-filters').appendChild(c); });
function renderList(){
const cur=document.querySelector('#paper-filters .chip.on').dataset.f;
$$('#paper-list .pcard').forEach(c=>c.classList.toggle('hide',cur!=='all'&&c.dataset.cat!==cur));
$$('#paper-text .hl').forEach(h=>h.classList.toggle('dim',cur!=='all'&&h.classList.contains(cur)===false));
if(!list.length) $('#paper-list').innerHTML='<div class="empty">划选左侧原文，选一个类别 → 生成主张卡</div>';
}
const srcPanel=root.querySelector('.src'); srcPanel.style.position='relative';
const pop=document.createElement('div'); pop.className='pop'; pop.style.display='none'; srcPanel.appendChild(pop);
Object.entries(cats).forEach(([k,[c,lab]])=>{
const b=document.createElement('button'); b.className='btn sm'; b.style.cssText='border-color:'+c+';color:'+c; b.textContent=lab;
b.onclick=()=>{ const sel=getSelection(); const r=sel.rangeCount?sel.getRangeAt(0):null;
if(!r||r.collapsed){ toast('请先划选一段文字'); pop.style.display='none'; return; }
const quote=r.toString().trim().slice(0,180); if(!quote){ return; }
const spans=highlightRange(r,k); sel.removeAllRanges();
addCard(k,quote,spans); pop.style.display='none';

const cancel=document.createElement('button'); cancel.className='btn sm'; cancel.textContent='✕'; cancel.onclick=()=>pop.style.display='none'; pop.appendChild(cancel);
$('#paper-text').addEventListener('mouseup',()=>{
setTimeout(()=>{ const sel=getSelection(); const r=sel.rangeCount?sel.getRangeAt(0):null;
if(!r||r.collapsed){ pop.style.display='none'; return; }
const rect=r.getBoundingClientRect(); const pr=srcPanel.getBoundingClientRect();
pop.style.display='flex';
pop.style.left=Math.min(Math.max(rect.left-pr.left+rect.width/2-110,4),pr.width-250)+'px';
pop.style.top=(rect.bottom-pr.top+8)+'px';
if(rect.bottom-pr.top+70>pr.height) pop.style.top=Math.max(rect.top-pr.top-56,4)+'px';
},10);
});
document.addEventListener('mousedown',e=>{ if(pop.style.display!=='none'&&!pop.contains(e.target)) pop.style.display='none'; });
function highlightRange(range,cls){
const spans=[]; const rootEl=$('#paper-text');
const ws=[]; const w=document.createTreeWalker(rootEl,NodeFilter.SHOW_TEXT); let n=w.currentNode;
while(n){ if(range.intersectsNode(n)) ws.push(n); n=w.nextNode(); }
ws.forEach(tn=>{
const s=(tn===range.startContainer)?range.startOffset:0;
const e=(tn===range.endContainer)?range.endOffset:tn.textContent.length;
const pre=tn.textContent.slice(0,s), mid=tn.textContent.slice(s,e), post=tn.textContent.slice(e);
if(!mid) return;
const sp=document.createElement('span'); sp.className='hl '+cls; sp.textContent=mid;
const postT=document.createTextNode(post); tn.textContent=pre;
tn.parentNode.insertBefore(sp,tn.nextSibling); sp.parentNode.insertBefore(postT,sp.nextSibling);
spans.push(sp);
});

}
function addCard(cat,quote,spans){
const id='pc'+Date.now(); list.push({id,cat,quote,spans});
const card=document.createElement('div'); card.className='pcard'; card.dataset.cat=cat;
card.style.cssText='border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)';

const q=document.createElement('div'); q.style.cssText='color:#3a4150;margin-bottom:7px;line-height:1.5'; q.textContent='“'+quote+'”'; card.appendChild(q);
const acts=document.createElement('div'); acts.style.cssText='display:flex;gap:5px;flex-wrap:wrap';
[['找反证','find_counterevidence'],['补引用','cite'],['删除','delete']].forEach(([lab,act])=>{
const b=document.createElement('button'); b.className='btn sm'; b.textContent=lab;

function updateReview(){
const rev=$('#tr-review'); const f=steps.filter(s=>s.flagged);
rev.innerHTML=f.length?f.map((s,i)=>'<div style="display:flex;gap:8px;align-items:center;border:1px solid #f3d7d7;background:#fdf3f3;border-radius:9px;padding:6px 10px;margin-bottom:6px;font-size:12px"><span style="color:var(--red)">⚑</span><span>'+s.label+'</span><span style="margin-left:auto;color:var(--mut);font-size:10.5px">'+(s.t==='fail'?'失败':'工具')+'</span><button class="btn sm" data-un="'+i+'">撤销</button></div>').join(''):'<div class="empty">暂无标记 · 回放中如有问题步骤，点行右侧 ⚑</div>';
$$('#tr-review [data-un]').forEach(b=>b.onclick=()=>{ steps[+b.dataset.un].flagged=false; updateRows(); updateReview(); });

water.addEventListener('click',e=>{ const row=e.target.closest('.trw'); if(!row) return; const i=+row.dataset.i;
if(e.target.closest('[data-f]')){ steps[i].flagged=!steps[i].flagged; updateRows(); updateReview(); send('trace.flag',{step:steps[i].label,flag:steps[i].flagged}); return; }
openStep(i); });
const pb=$('#tr-play');
pb.onclick=()=>{ if(play){ clearInterval(play); play=null; cur=-1; pb.textContent='▶ 回放'; updateRows(); return; }
cur=-1; pb.textContent='⏸ 暂停';
play=setInterval(()=>{ cur++; if(cur>=steps.length){ clearInterval(play); play=null; cur=-1; pb.textContent='▶ 回放'; updateRows(); return; }
updateRows(); const r=$('#tr-water .trw[data-i="'+cur+'"]'); if(r) r.scrollIntoView({block:'nearest'}); },650);
send('trace.play',{}); };
updateRows(); updateReview();
};

ex.querySelector('[data-rw=0]').onclick=()=>{ ex.style.display='none'; }; };
bar.querySelector('[data-a=comment]').onclick=()=>{ const ex=bar.querySelector('.extra'); ex.style.display='block'; ex.innerHTML='<textarea rows="2" placeholder="评论…" style="width:100%;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px"></textarea><div style="display:flex;gap:5px;margin-top:5px"><button class="btn sm acc" data-cm="1">保存</button><button class="btn sm" data-cm="0">取消</button></div>';

doc.addEventListener('click',e=>{ const sp=e.target.closest('.rmk'); if(!sp) return; showBar(sp,+sp.dataset.i); });

};
stats();
};
}catch(e){console.warn('hub legacy demos [2] disabled:',e.message);}

let suppress=0;
$('#bd-lanes').innerHTML=lanes.map(l=>'<div class="panel lane" data-lane="'+l.id+'" style="min-height:130px"><div class="panel-title" style="margin-bottom:8px"><span style="width:8px;height:8px;border-radius:50%;background:'+l.color+';display:inline-block"></span>'+l.name+'<span class="cnt" style="margin-left:auto;font:11px ui-monospace,monospace;color:var(--mut)">0</span></div><div class="cards" style="display:flex;flex-direction:column;gap:8px;min-height:90px"></div></div>').join('');
function laneOf(id){ return lanes.find(l=>l.id===id); }
function render(){
lanes.forEach(l=>{ const box=$('#bd-lanes [data-lane="'+l.id+'"] .cards'); box.innerHTML='';
cards.filter(c=>c.lane===l.id).forEach(c=>{ const d=document.createElement('div'); d.draggable=true; d.className='bcard'; d.dataset.id=c.id;
d.style.cssText='border:1px solid var(--line);border-left:3px solid '+laneOf(c.lane).color+';border-radius:9px;padding:8px 10px;font-size:12px;background:#fff;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)';
d.innerHTML='<div style="font-weight:600">'+c.title+'</div><div style="display:flex;gap:4px;margin-top:5px;flex-wrap:wrap">'+c.tags.map(t=>'<span class="tag" style="background:#e7e9fb;color:#3a4150">'+t+'</span>').join('')+'</div><div style="margin-top:6px;height:3px;background:#eee;border-radius:2px;overflow:hidden"><div style="height:100%;width:'+c.pct+'%;background:'+laneOf(c.lane).color+'"></div></div>';
d.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',c.id); d.style.opacity=.5; });
d.addEventListener('dragend',()=>{ d.style.opacity=1; });
d.addEventListener('click',()=>{ if(Date.now()<suppress) return; openCard(c); });
box.appendChild(d); });
$('#bd-lanes [data-lane="'+l.id+'"] .cnt').textContent=cards.filter(c=>c.lane===l.id).length; });
}
$$('#bd-lanes .lane').forEach(lp=>{
lp.addEventListener('dragover',e=>{ e.preventDefault(); lp.style.outline='2px dashed var(--acc)'; });
lp.addEventListener('dragleave',()=>{ lp.style.outline=''; });
lp.addEventListener('drop',e=>{ e.preventDefault(); lp.style.outline='';
const id=e.dataTransfer.getData('text/plain'); const c=cards.find(x=>x.id===id); if(!c)return;
const from=c.lane; c.lane=lp.dataset.lane; suppress=Date.now()+200; render();
toast(c.title+' → '+laneOf(c.lane).name); send('board.move',{id:c.id,from,to:c.lane}); });
});
function openCard(c){
const lane=laneOf(c.lane); const next=lanes[(lanes.indexOf(lane)+1)%lanes.length];
const box=modal('<h3>'+c.title+' <span class="tag" style="background:'+lane.color+'">'+lane.name+'</span></h3>'+
'<div class="panel-title">验收标准</div>'+c.acc.map(a=>'<div style="font-size:12px;margin-bottom:4px">☐ '+a+'</div>').join('')+
'<div class="panel-title" style="margin-top:10px">依赖</div>'+ (c.dep.length?c.dep.map(d=>'<span class="chip" style="cursor:default">'+d+'</span>').join(' '):'<span style="font-size:12px;color:var(--mut)">无</span>')+
'<div class="panel-title" style="margin-top:10px">最后一次工具结果</div><pre class="pre mini">'+c.result+'</pre>'+
'<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn acc" id="bd-next">状态 → '+next.name+'</button><button class="btn" id="bd-comment">评论</button><button class="btn" id="bd-patch">模拟 agent patch</button></div>');
box.querySelector('#bd-next').onclick=()=>{ c.lane=next.id; render(); box.remove(); toast(c.title+' → '+next.name); send('board.move',{id:c.id,from:lane.id,to:c.lane}); };
box.querySelector('#bd-comment').onclick=()=>{ toast('已回传评论请求'); send('board.comment',{id:c.id}); };
box.querySelector('#bd-patch').onclick=()=>{ c.lane=next.id; render(); box.remove(); toast('agent patch: '+c.title+' → '+next.name+'（无整页刷新）'); send('board.patch',{id:c.id,to:next.id}); };
}
render();
};
Demos.sheet=function(){
const root=$('#d-sheet'); if(!root||root.dataset.bound) return; root.dataset.bound=1;
const heads=['用例','通过率%','耗时(s)','成本($)','覆盖度','状态'];
const data=[['中文摘要抽取',92,3.2,0.21,81,'通过'],['长文档问答',78,12.4,1.02,73,'通过'],['工具调用',85,8.1,0.66,77,'通过'],['代码修复',90,6.4,0.52,88,'通过'],['反事实推理',64,9.8,0.83,69,'部分'],['长尾检索',41,14.2,1.21,58,'未过'],['合计','=SUM(B1:B6)','=AVG(C1:C6)','=MAX(D1:D6)','=AVG(E1:E6)','']];
const state={freeze:false,sel:null,filter:'',sort:[null,0]};
function colLetter(i){ return 'ABCDEF'[i]; }
function cellRef(r,c){ return colLetter(c)+(r+1); }
function parseRef(ref){ const m=ref.match(/^([A-F])(\d+)$/); return m?[+m[2]-1,m[1].charCodeAt(0)-65]:null; }
function cellVal(r,c){ const v=data[r][c]; if(typeof v==='string'&&v.startsWith('=')) return compute(v); return v; }
function compute(f){
const m=f.replace(/^=/,'').match(/^(SUM|AVG|MAX|MIN)\(([A-F])(\d+):([A-F])(\d+)\)$/i);
if(m){ const fn=m[1].toUpperCase(), c1=m[2].charCodeAt(0)-65, r1=+m[3]-1, c2=m[4].charCodeAt(0)-65, r2=+m[5]-1;
const vals=[]; for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ const v=cellVal(r,c); if(typeof v==='number') vals.push(v); }
if(!vals.length) return 0;
if(fn==='SUM') return +vals.reduce((a,b)=>a+b,0).toFixed(2);
if(fn==='AVG') return +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
if(fn==='MAX') return Math.max(...vals);
return Math.min(...vals);
}
try{ const expr=f.slice(1).replace(/[A-F]\d+/g,ref=>{ const p=parseRef(ref); const v=cellVal(p[0],p[1]); return typeof v==='number'?v:'0'; });
return +(Function('return ('+expr+')')()); }catch(e){ return 'ERR'; }
}
function fmt(v){ if(typeof v==='number') return Math.round(v*100)/100+''; return v; }
const t=$('#sh-table');
function render(){
const [sortC,sortD]=state.sort;
let rows=[]; data.forEach((r,i)=>rows.push([i,r]));
if(state.filter) rows=rows.filter(([,r])=>r.join(' ').toLowerCase().includes(state.filter));
if(sortC!=null){ rows.sort((a,b)=>{ const x=cellVal(a[0],sortC), y=cellVal(b[0],sortC);
const r=typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'zh'); return sortD?r:-r; }); }
let h='<tr>'; heads.forEach((hname,c)=>{ h+='<th data-c="'+c+'" style="cursor:pointer;white-space:nowrap">'+hname+(sortC===c?(sortD?' ▲':' ▼'):'')+'</th>'; }); h+='</tr>';
rows.forEach(([ri])=>{ h+='<tr data-ri="'+ri+'">';
heads.forEach((_,c)=>{ const v=cellVal(ri,c); const isF=typeof data[ri][c]==='string'&&data[ri][c].startsWith('=');
h+='<td data-c="'+c+'" style="'+(state.freeze&&c===0?'position:sticky;left:0;background:#faf9f5;z-index:2;':'')+'">'+(isF?'<span style="color:var(--acc);font-size:10px">ƒ </span>':'')+fmt(v)+'</td>'; }); h+='</tr>'; });
t.innerHTML=h;
$$('#sh-table th[data-c]').forEach(th=>th.onclick=()=>{ const c=+th.dataset.c; if(state.sort[0]===c) state.sort[1]=1-state.sort[1]; else state.sort=[c,1]; render(); send('sheet.sort',{col:heads[c]}); });
}
const tdSel={};
t.addEventListener('mousedown',e=>{ const td=e.target.closest('td'); if(!td) return; const tr=td.closest('tr'); if(!tr) return;
state.sel=null; paint();
tdSel.c=+td.dataset.c; tdSel.ri=+tr.dataset.ri;
document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu,{once:true}); });
function mm(e){ const td=document.elementFromPoint(e.clientX,e.clientY)?.closest('td'); if(!td)return; const tr=td.closest('tr'); if(!tr)return;
state.sel={c1:tdSel.c,c2:+td.dataset.c,ri1:tdSel.ri,ri2:+tr.dataset.ri};
paint(); }
function mu(){ document.removeEventListener('mousemove',mm);
if(state.sel){ paint(); $('#sh-explain').style.display=''; $('#sh-edit').style.display=''; send('sheet.select',{range:rangeStr()}); } }
function rangeStr(){ const s=state.sel; return cellRef(Math.min(s.ri1,s.ri2),Math.min(s.c1,s.c2))+':'+cellRef(Math.max(s.ri1,s.ri2),Math.max(s.c1,s.c2)); }
function paint(){ $$('#sh-table td').forEach(td=>{ const tr=td.closest('tr'); if(!tr||!state.sel){ td.style.background=''; return; }
const ri=+tr.dataset.ri, c=+td.dataset.c;
const on=ri>=Math.min(state.sel.ri1,state.sel.ri2)&&ri<=Math.max(state.sel.ri1,state.sel.ri2)&&c>=Math.min(state.sel.c1,state.sel.c2)&&c<=Math.max(state.sel.c1,state.sel.c2);
td.style.background=on?'#eef0fe':''; }); }
t.addEventListener('dblclick',e=>{ const td=e.target.closest('td'); if(!td)return; const tr=td.closest('tr'); if(!tr)return;
const ri=+tr.dataset.ri, c=+td.dataset.c;
const inp=document.createElement('input'); inp.value=data[ri][c]; inp.style.cssText='width:100%;font:inherit;border:1px solid var(--acc);border-radius:4px;padding:1px 4px';
td.textContent=''; td.appendChild(inp); inp.focus();
let skip=false;
inp.onkeydown=e2=>{ if(e2.key==='Enter') inp.blur(); if(e2.key==='Escape'){ skip=true; td.textContent=fmt(data[ri][c]); inp.blur(); } };
inp.onblur=()=>{ if(skip) return; const v=inp.value.trim(); data[ri][c]=/^-?\d*\.?\d+$/.test(v)?+v:v;
const ref=cellRef(ri,c); render(); renderChart(); send('sheet.edit',{cell:ref,value:data[ri][c]}); toast(ref+' 已更新'); };
});
function renderChart(){
if($('#sh-chartbox').style.display==='none') return;
const svg=$('#sh-chartsvg'); const vals=data.slice(0,6).map(r=>+cellVal(r,1)); const labels=data.slice(0,6).map(r=>String(r[0]));
const W=560,H=170,pad=36,bw=48,max=Math.max(...vals)*1.15;
let h=''; vals.forEach((v,i)=>{ const x=pad+i*(bw+18); const bh=v/max*(H-52);
h+='<rect x="'+x+'" y="'+(H-34-bh)+'" width="'+bw+'" height="'+bh+'" rx="4" fill="#4f5ef0" opacity="'+(0.55+0.45*v/max)+'"></rect>'+
'<text x="'+(x+bw/2)+'" y="'+(H-34-bh-6)+'" text-anchor="middle" font-size="10" fill="#5b6270">'+v+'</text>'+
'<text x="'+(x+bw/2)+'" y="'+(H-14)+'" text-anchor="middle" font-size="9.5" fill="#8a8f98">'+(labels[i].length>4?labels[i].slice(0,4):labels[i])+'</text>'; });
svg.innerHTML=h;
}
$('#sh-filter').oninput=e=>{ state.filter=e.target.value.trim().toLowerCase(); render(); };
$('#sh-freeze').onclick=function(){ state.freeze=!state.freeze; this.classList.toggle('on',state.freeze); render(); toast(state.freeze?'已冻结首列':'已解冻'); };
$('#sh-chart').onclick=function(){ const box=$('#sh-chartbox'); const show=box.style.display==='none'; box.style.display=show?'block':'none'; this.classList.toggle('on',show); if(show) renderChart(); };
$('#sh-explain').onclick=()=>{ const s=state.sel; const cells=[];
for(let ri=Math.min(s.ri1,s.ri2);ri<=Math.max(s.ri1,s.ri2);ri++){ const row=[]; for(let c=Math.min(s.c1,s.c2);c<=Math.max(s.c1,s.c2);c++) row.push(cellRef(ri,c)+'='+fmt(cellVal(ri,c))); cells.push(row.join(', ')); }
send('sheet.explain',{range:rangeStr(),cells}); toast('已回传选区给 agent'); };
$('#sh-edit').onclick=()=>{ send('sheet.regionEdit',{range:rangeStr()}); toast('agent 将只改这些格子（模拟）'); };
render();
};
}catch(e){console.warn('hub legacy demos disabled:',e.message);}
</script>
