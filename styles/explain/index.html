<!DOCTYPE html>
<!-- Generated shell source for /talk explain design system. Run: node build.mjs -->
<html lang="zh-CN" data-explain-design-system="editorial">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
<style>
:root{
  --bg:#FAF9F5;
  --bg-soft:#F3EFE6;
  --panel:#FFFFFF;
  --panel-2:#F7F5EE;
  --line:#E2DCD0;
  --line-soft:#ECE8DE;
  --txt:#1B1A16;
  --txt-dim:#4E493E;
  --txt-faint:#756E62;
  --accent:#1B4965;
  --accent-soft:rgba(27,73,101,0.08);
  --brand:#8B3A1F;
  --gold:#7B5A20;
  --gold-text:#6A4B10;
  --good:#2D6A4F;
  --warn:#7A5713;
  --bad:#9C3A2E;
  --code-bg:#23211C;
  --code-fg:#ECE7DC;
  --shadow:0 8px 24px -16px rgba(40,30,15,0.18);
  --shadow-hover:0 12px 28px -14px rgba(40,30,15,0.24);
  --radius:10px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --serif:"Source Serif Pro","Charter","Noto Serif CJK SC","Songti SC",serif;
  --mono:"SFMono-Regular",Consolas,"SF Mono",monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:15px}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--txt);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#fff}

/* —— 居中单栏布局（66~72ch 沉浸式阅读流） —— */
.explain-shell{
  max-width:740px;
  margin:0 auto;
  padding:44px 24px 96px;
}

/* —— 顶部引子（Hero / Hook） —— */
.explain-hero{
  margin-bottom:40px;
  padding-bottom:28px;
  border-bottom:1px solid var(--line);
}
.explain-hero .tag-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.explain-hero h1{
  font-family:var(--serif);
  font-size:36px;
  font-weight:700;
  letter-spacing:-0.8px;
  line-height:1.25;
  color:var(--txt);
  margin-bottom:14px;
}
.explain-hero .lead{
  font-family:var(--serif);
  font-size:18px;
  line-height:1.6;
  color:var(--txt-dim);
}
.explain-hero .meta-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-family:var(--mono);
  font-size:11px;
  color:var(--txt-faint);
  margin-top:16px;
}

/* —— 胶囊标签 —— */
.pill{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  padding:2px 8px;
  border-radius:4px;
  letter-spacing:0.4px;
  display:inline-block;
}
.pill.primary{background:rgba(27,73,101,0.12);color:var(--accent)}
.pill.brand{background:rgba(139,58,31,0.12);color:var(--brand)}
.pill.neutral{background:var(--bg-soft);color:var(--txt-dim);border:1px solid var(--line)}

/* —— 教学层级区块（平铺直陈，零折叠） —— */
.layer-block{
  margin:36px 0;
}
.layer-tag{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:6px;
}
.layer-block h2{
  font-family:var(--serif);
  font-size:24px;
  font-weight:700;
  letter-spacing:-0.3px;
  color:var(--txt);
  margin-bottom:12px;
  line-height:1.3;
}
.layer-body{
  font-size:14.5px;
  line-height:1.8;
  color:var(--txt-dim);
}
.layer-body p{margin-bottom:12px}
.layer-body p:last-child{margin-bottom:0}
.layer-body ul,.layer-body ol{
  padding-left:1.4rem;
  margin:10px 0 14px;
  color:var(--txt-dim);
}
.layer-body li+li{margin-top:6px}
.layer-body code{
  font-family:var(--mono);
  font-size:12.5px;
  background:var(--bg-soft);
  padding:2px 6px;
  border-radius:4px;
  color:var(--txt);
  border:1px solid var(--line-soft);
}

/* —— 类比卡片与失效点 —— */
.analogy-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:var(--radius);
  padding:18px 22px;
  margin:16px 0;
  box-shadow:var(--shadow);
}
.analogy-card .analogy-text{
  font-size:14.5px;
  line-height:1.75;
  color:var(--txt);
  margin-bottom:12px;
}
.breakage-note{
  background:rgba(122,87,19,0.07);
  border:1px solid rgba(122,87,19,0.25);
  border-radius:7px;
  padding:10px 14px;
  font-size:12.5px;
  line-height:1.65;
  color:var(--warn);
}
.breakage-note b{
  color:var(--txt);
  font-family:var(--sans);
}

/* —— 代码实战块 —— */
.code-block{
  background:var(--code-bg);
  color:var(--code-fg);
  border-radius:var(--radius);
  padding:16px 20px;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.7;
  overflow-x:auto;
  white-space:pre;
  box-shadow:var(--shadow);
  margin:16px 0;
}
.code-block .kw{color:#D4A876}
.code-block .str{color:#9BBF8F}
.code-block .cm{color:#807868;font-style:italic}
.code-block .fn{color:#E0A887}
.code-block .num{color:#C9A87C}

/* —— 局限与边界 —— */
.limits-block{
  background:rgba(156,58,46,0.06);
  border:1px solid rgba(156,58,46,0.25);
  border-left:4px solid var(--bad);
  border-radius:var(--radius);
  padding:18px 20px;
  margin:32px 0;
}
.limits-block h3{
  font-family:var(--serif);
  font-size:16px;
  font-weight:700;
  color:var(--bad);
  margin-bottom:8px;
}
.limits-block ul{
  padding-left:1.25rem;
  font-size:13px;
  line-height:1.7;
  color:var(--txt-dim);
}
.limits-block li+li{margin-top:5px}

/* —— 内嵌理解自测卡片 —— */
.check-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  margin:20px 0;
  box-shadow:var(--shadow);
}
.check-card .check-prompt{
  font-size:14px;
  font-weight:700;
  color:var(--txt);
  margin-bottom:6px;
}
.check-card .check-sub{
  font-size:11.5px;
  color:var(--txt-faint);
  margin-bottom:14px;
}
.choices-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media (max-width:560px){
  .choices-grid{grid-template-columns:1fr}
}
.choice-btn{
  font-family:var(--sans);
  font-size:13px;
  padding:10px 14px;
  border-radius:7px;
  background:var(--bg-soft);
  border:1px solid var(--line);
  color:var(--txt);
  cursor:pointer;
  text-align:left;
  transition:all 0.18s;
  outline:none;
}
.choice-btn:hover{
  background:#EBE5D8;
  border-color:var(--accent);
  color:var(--txt);
}
.choice-btn:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.choice-btn.selected{
  background:var(--accent);
  color:#ffffff;
  border-color:var(--accent);
  box-shadow:0 4px 12px -4px var(--accent);
}

/* —— 最终核心认知沉淀（Takeaway） —— */
.takeaway-block{
  background:linear-gradient(135deg,#F7F3E9,#EDE6D6);
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px 28px;
  margin:40px 0 0;
  box-shadow:var(--shadow);
  text-align:center;
}
.takeaway-block .takeaway-lbl{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--brand);
  font-weight:700;
  margin-bottom:6px;
}
.takeaway-block h3{
  font-family:var(--serif);
  font-size:20px;
  font-weight:700;
  color:var(--txt);
  margin-bottom:10px;
  line-height:1.35;
}
.takeaway-block p{
  font-size:12.5px;
  color:var(--txt-dim);
  max-width:560px;
  margin:0 auto;
}

/* —— 打印与降级适配 —— */
@media print{
  @page{size:A4 portrait;margin:16mm 14mm}
  body{background:#fff!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow-wrap:break-word;word-break:break-word;line-break:strict}
  .explain-shell{max-width:none;padding:0}
  .explain-hero,.layer-block,.analogy-card,.check-card,.takeaway-block,.limits-block,.code-block{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .layer-tag{break-after:avoid;page-break-after:avoid}
  h1,h2,h3,h4,h5,h6{break-after:avoid;page-break-after:avoid}
  p,li{orphans:3;widows:3}
  pre,code,.code-block{white-space:pre-wrap!important;word-break:break-all!important;overflow-wrap:anywhere!important}
  svg{max-width:100%!important;height:auto!important}
  .choice-btn{border:1px solid #ccc;background:#fff;color:#000}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main class="explain-shell" id="explain-main" tabindex="-1">
  <div id="explain-content-root">
{{content}}
  </div>
</main>
<script id="explain-runtime">
(function () {
  'use strict';

  var VERSION = '1.0.0';
  document.documentElement.classList.add('explain-js');
  document.documentElement.setAttribute('data-explain-ds-version', VERSION);

  function onReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, { once: true });
    } else {
      fn();
    }
  }

  function initCheckButtons() {
    document.addEventListener('click', function (event) {
      var btn = event.target && event.target.closest ? event.target.closest('button[data-talk-event="explain-check"]') : null;
      if (!btn) return;

      var card = btn.closest('.check-card');
      if (card) {
        card.querySelectorAll('button[data-talk-event="explain-check"]').forEach(function (b) {
          b.classList.remove('selected');
          b.removeAttribute('aria-pressed');
        });
      }
      btn.classList.add('selected');
      btn.setAttribute('aria-pressed', 'true');
    });
  }

  function audit(root) {
    root = root || document;
    var errors = [];
    var warnings = [];
    var idCounts = {};

    root.querySelectorAll('[id]').forEach(function (node) {
      idCounts[node.id] = (idCounts[node.id] || 0) + 1;
    });
    Object.keys(idCounts).forEach(function (id) {
      if (idCounts[id] > 1) errors.push('重复 ID：' + id);
    });

    var h1s = root.querySelectorAll('h1');
    if (h1s.length !== 1) {
      errors.push('Explain 页面必须有且仅有一个 h1；当前找到 ' + h1s.length + ' 个。');
    }

    // 核心硬原则：绝对禁止 <details> 折叠
    var details = root.querySelectorAll('details');
    if (details.length > 0) {
      errors.push('Explain 页面严禁使用 <details> 隐藏或折叠教学内容；必须直接平铺可见（发现 ' + details.length + ' 个）。');
    }

    // 校验标题层级
    var headings = Array.prototype.map.call(root.querySelectorAll('h1,h2,h3,h4,h5,h6'), function (h) {
      return Number(h.tagName.slice(1));
    });
    for (var i = 1; i < headings.length; i += 1) {
      if (headings[i] > headings[i - 1] + 1) {
        warnings.push('标题层级跳跃：从 h' + headings[i - 1] + ' 跳到 h' + headings[i] + '。');
        break;
      }
    }

    // 校验类比卡片必须包含恰好一个直接子项 .analogy-text 且紧邻跟随恰好一个 .breakage-note
    root.querySelectorAll('.analogy-card').forEach(function (node, index) {
      var directElements = Array.prototype.filter.call(node.children, function (el) { return el.nodeType === 1; });
      var textIndices = [];
      var breakageIndices = [];
      for (var i = 0; i < directElements.length; i += 1) {
        if (directElements[i].classList.contains('analogy-text')) textIndices.push(i);
        if (directElements[i].classList.contains('breakage-note')) breakageIndices.push(i);
      }
      if (
        textIndices.length !== 1 ||
        breakageIndices.length !== 1 ||
        breakageIndices[0] !== textIndices[0] + 1
      ) {
        errors.push('第 ' + (index + 1) + ' 个 .analogy-card 必须包含恰好一个直接子元素 .analogy-text 且紧邻跟随恰好一个 .breakage-note。');
      }
    });

    // 校验无障碍按钮
    root.querySelectorAll('button').forEach(function (node) {
      if (!node.textContent.trim() && !node.getAttribute('aria-label')) {
        warnings.push('按钮缺少文本或 aria-label。');
      }
    });

    // 校验链接安全性与 target
    root.querySelectorAll('a[href]').forEach(function (node) {
      var href = (node.getAttribute('href') || '').toLowerCase().trim();
      if (href.indexOf('javascript:') === 0 || href.indexOf('vbscript:') === 0) {
        errors.push('发现不安全的 URL scheme: ' + href);
      }
      var target = (node.getAttribute('target') || '').toLowerCase();
      if (target === '_blank') {
        var rel = (node.getAttribute('rel') || '').toLowerCase();
        if (rel.indexOf('noopener') === -1) {
          errors.push('target="_blank" 链接缺少 rel="noopener"。');
        }
      }
    });

    return {
      version: VERSION,
      errors: errors,
      warnings: warnings,
      stats: {
        layers: root.querySelectorAll('.layer-block').length,
        checks: root.querySelectorAll('.check-card').length,
        analogies: root.querySelectorAll('.analogy-card').length,
        codeBlocks: root.querySelectorAll('.code-block').length
      }
    };
  }

  onReady(initCheckButtons);

  window.ExplainDesignSystem = Object.freeze({
    version: VERSION,
    audit: audit
  });
})();
</script>
</body>
</html>
