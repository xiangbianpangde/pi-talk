<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<style>
  /* ==== drawflow.min.css (内联，必须放在最前以保证覆盖) ==== */
.drawflow,.drawflow .parent-node{position:relative}.parent-drawflow{display:flex;overflow:hidden;touch-action:none;outline:0}.drawflow{width:100%;height:100%;user-select:none;perspective:0}.drawflow .drawflow-node{display:flex;align-items:center;position:absolute;background:#0ff;width:160px;min-height:40px;border-radius:4px;border:2px solid #000;color:#000;z-index:2;padding:15px}.drawflow .drawflow-node.selected{background:red}.drawflow .drawflow-node:hover{cursor:move}.drawflow .drawflow-node .inputs,.drawflow .drawflow-node .outputs{width:0}.drawflow .drawflow-node .drawflow_content_node{width:100%;display:block}.drawflow .drawflow-node .input,.drawflow .drawflow-node .output{position:relative;width:20px;height:20px;background:#fff;border-radius:50%;border:2px solid #000;cursor:crosshair;z-index:1;margin-bottom:5px}.drawflow .drawflow-node .input{left:-27px;top:2px;background:#ff0}.drawflow .drawflow-node .output{right:-3px;top:2px}.drawflow svg{z-index:0;position:absolute;overflow:visible!important}.drawflow .connection{position:absolute;pointer-events:none}.drawflow .connection .main-path{fill:none;stroke-width:5px;stroke:#4682b4;pointer-events:all}.drawflow .connection .main-path:hover{stroke:#1266ab;cursor:pointer}.drawflow .connection .main-path.selected{stroke:#43b993}.drawflow .connection .point{cursor:move;stroke:#000;stroke-width:2;fill:#fff;pointer-events:all}.drawflow .connection .point.selected,.drawflow .connection .point:hover{fill:#1266ab}.drawflow .main-path{fill:none;stroke-width:5px;stroke:#4682b4}.drawflow-delete{position:absolute;display:block;width:30px;height:30px;background:#000;color:#fff;z-index:4;border:2px solid #fff;line-height:30px;font-weight:700;text-align:center;border-radius:50%;font-family:monospace;cursor:pointer}.drawflow>.drawflow-delete{margin-left:-15px;margin-top:15px}.parent-node .drawflow-delete{right:-15px;top:-15px}

  /* ===== canvas 白板全屏布局 ===== */
  html,body{margin:0;padding:0;background:#0b1220;color:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;}
  #ed-root{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;background:#0b1220;}
  #ed-toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0f172a;border-bottom:1px solid #1e293b;flex-wrap:wrap;}
  #ed-toolbar .t-title{font-weight:800;font-size:13.5px;letter-spacing:.02em;color:#f1f5f9;white-space:nowrap;}
  #ed-toolbar .t-title small{display:block;font-weight:400;color:#64748b;font-size:10.5px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #ed-toolbar .t-spacer{flex:1;}
  #ed-count{font-size:11px;color:#94a3b8;white-space:nowrap;padding:4px 10px;background:#1e293b;border-radius:999px;}
  .ed-btn{appearance:none;border:1px solid #334155;background:#1e293b;color:#e2e8f0;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap;}
  .ed-btn:hover{border-color:#38bdf8;color:#38bdf8;}
  .ed-btn.primary{background:#0ea5e9;border-color:#0ea5e9;color:#082f49;font-weight:700;}
  .ed-btn.primary:hover{background:#38bdf8;color:#082f49;border-color:#38bdf8;}
  .ed-btn.danger:hover{border-color:#f43f5e;color:#f43f5e;}
  .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:#94a3b8;}
  .legend .lg{display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .legend .lg i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
  /* popover */
  .pop{position:absolute;top:52px;right:14px;z-index:100;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);min-width:250px;}
  .pop h4{margin:0 0 8px;font-size:12px;color:#e2e8f0;}
  .pop .p-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .pop .p-layer{display:flex;align-items:center;gap:6px;border:1px solid #334155;background:#1e293b;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;color:#e2e8f0;}
  .pop .p-layer:hover{border-color:#38bdf8;}
  .pop .p-layer i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .pop input,.pop select{background:#0b1220;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:6px 8px;font:inherit;font-size:12px;width:100%;box-sizing:border-box;margin-bottom:6px;}
  .pop .p-hint{font-size:10.5px;color:#64748b;margin-top:4px;line-height:1.5;}
  /* canvas 画布 */
  #drawflow{flex:1;min-height:0;position:relative;overflow:hidden;background:#0b1220;background-image:radial-gradient(circle,#1e293b 1px,transparent 1px);background-size:26px 26px;}
  .parent-drawflow{height:100%;width:100%;}
  /* 分组装饰层（不可交互，跟随缩放平移） */
  .cg-group{position:absolute;border:1.5px dashed rgba(148,163,184,.5);border-radius:14px;background:rgba(148,163,184,.05);z-index:0;box-sizing:border-box;pointer-events:none;}
  .cg-group .cg-label{position:absolute;top:6px;left:12px;font-size:11px;font-weight:700;letter-spacing:.06em;color:rgba(226,232,240,.75);}
  /* 节点 */
  .drawflow .drawflow-node{width:238px;min-height:0;padding:0;border-radius:12px;background:#1e293b;border:1.5px solid var(--layer,#64748b);box-shadow:0 10px 30px rgba(0,0,0,.4);color:#e2e8f0;align-items:stretch;}
  .drawflow .drawflow-node:hover{box-shadow:0 10px 34px rgba(56,189,248,.22);}
  .drawflow .drawflow-node.selected{outline:2px solid var(--layer,#64748b);outline-offset:3px;border-color:#fff;}
  .drawflow .drawflow-node.layer-presentation{--layer:#fb7185;}
  .drawflow .drawflow-node.layer-application{--layer:#fb923c;}
  .drawflow .drawflow-node.layer-domain{--layer:#a78bfa;}
  .drawflow .drawflow-node.layer-infrastructure{--layer:#34d399;}
  .drawflow .drawflow-node.layer-common{--layer:#fbbf24;}
  .drawflow .drawflow-node.layer-stage{--layer:#22d3ee;}
  .drawflow_content_node{display:block;width:100%;padding:10px 12px;box-sizing:border-box;}
  .anode-head{display:flex;align-items:center;gap:7px;}
  .anode-dot{width:9px;height:9px;border-radius:50%;background:var(--layer);box-shadow:0 0 8px var(--layer);flex:none;}
  .anode-name{font-weight:700;font-size:13.5px;flex:1;cursor:text;line-height:1.3;word-break:break-all;}
  .anode-name:hover{text-decoration:underline dotted #64748b;}
  .anode-layer{font-size:9.5px;color:#94a3b8;border:1px solid #334155;border-radius:999px;padding:1px 6px;flex:none;}
  .anode-sub{margin-top:5px;font-size:11px;color:#94a3b8;line-height:1.45;cursor:text;}
  .anode-sub:hover{text-decoration:underline dotted #64748b;}
  .anode-del{appearance:none;border:none;background:transparent;color:#64748b;font-size:15px;line-height:1;cursor:pointer;padding:0 2px;flex:none;border-radius:6px;}
  .anode-del:hover{color:#f43f5e;background:rgba(244,63,94,.15);}
  .drawflow .drawflow-node .input,.drawflow .drawflow-node .output{width:14px;height:14px;background:#0b1220;border:2px solid var(--layer,#64748b);box-shadow:0 0 6px rgba(0,0,0,.5);}
  .drawflow .drawflow-node .input{left:-25px;}
  .drawflow .drawflow-node .output{right:-2px;}
  .drawflow .connection .main-path{stroke:#64748b;stroke-width:2.5;}
  .drawflow .connection .main-path:hover{stroke:#38bdf8;stroke-width:3;}
  .drawflow .connection .main-path.selected{stroke:#34d399;}
  /* toast */
  #ed-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#0ea5e9;color:#082f49;font-weight:700;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:10001;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  #ed-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .ed-hintbar{font-size:10.5px;color:#64748b;padding:0 14px;background:#0d1526;border-top:1px solid #16213a;line-height:26px;}
</style>
</head>
<body>
{{content}}
<div id="ed-root">
  <div id="ed-toolbar">
    <div class="t-title">🖊️ <span id="ed-title">Canvas 白板</span><small id="ed-subtitle">可编辑 · 拖动连线/节点 · 双击改名/改备注 · Delete 删除</small></div>
    <div class="legend">
      <span class="lg"><i style="background:#fb7185"></i>表现层</span>
      <span class="lg"><i style="background:#fb923c"></i>应用层</span>
      <span class="lg"><i style="background:#a78bfa"></i>领域层</span>
      <span class="lg"><i style="background:#34d399"></i>基础设施</span>
      <span class="lg"><i style="background:#fbbf24"></i>公共层</span>
      <span class="lg"><i style="background:#22d3ee"></i>管道阶段</span>
    </div>
    <div class="t-spacer"></div>
    <span id="ed-count">0 节点 · 0 连线</span>
    <button class="ed-btn" id="btn-add">➕ 添加节点</button>
    <button class="ed-btn" id="btn-zoomout">−</button>
    <button class="ed-btn" id="btn-zoomin">＋</button>
    <button class="ed-btn" id="btn-fit">⌖ 适配</button>
    <button class="ed-btn" id="btn-undo">↩️ 撤销</button>
    <button class="ed-btn" id="btn-redo">↪️ 重做</button>
    <button class="ed-btn danger" id="btn-del">🗑️ 删除选中</button>
    <button class="ed-btn" id="btn-reset">♻️ 重置</button>
    <button class="ed-btn primary" id="btn-export">💾 导出给 agent</button>
  </div>
  <div id="drawflow"></div>
  <div id="add-pop" class="pop" hidden>
    <h4>添加节点（选分层）</h4>
    <div class="p-row" id="pop-layers"></div>
    <h4>自定义节点</h4>
    <input id="pop-name" placeholder="节点名称" />
    <select id="pop-layer-sel">
      <option value="presentation">表现层</option>
      <option value="application">应用层</option>
      <option value="domain">领域层</option>
      <option value="infrastructure">基础设施</option>
      <option value="common">公共层</option>
      <option value="stage">管道阶段</option>
    </select>
    <button class="ed-btn" id="pop-add" style="width:100%">➕ 添加自定义节点</button>
    <div class="p-hint">💡 双击标题改名称；双击灰色行写备注；右侧 ● 拖到左侧 ● 连线。</div>
  </div>
  <div id="ed-toast"></div>
  <div class="ed-hintbar">与 Obsidian 白板互通：编辑完点「💾 导出给 agent」→ 我写回 .canvas 文件，Obsidian 同步更新</div>
</div>
<script>
(function(){
  // drawflow 双 CDN 回退加载（unpkg → jsdelivr）
  var CDNS=['https://unpkg.com/drawflow@0.0.55/dist/drawflow.min.js',
            'https://cdn.jsdelivr.net/npm/drawflow@0.0.55/dist/drawflow.min.js'];
  var i=0;
  function next(){
    if(i>=CDNS.length)return;
    var s=document.createElement('script');
    s.src=CDNS[i++];
    s.onload=function(){if(typeof window.Drawflow!=='undefined'){window.__dfReady=1;}else if(i<CDNS.length){next();}};
    s.onerror=function(){if(i<CDNS.length)next();};
    document.head.appendChild(s);
  }
  next();
})();
</script>
<script>
(function(){
  'use strict';
  /* ================= Obsidian Canvas 兼容白板 =================
     数据协议（window.__CANVAS__）:
     { title, canvasPath, viewport:{x,y,zoom},
       nodes: [{id,name,layer,sub,x,y,w,h}],
       edges: [{from,to}],
       groups: [{id,label,x,y,w,h,color}] }   // color = Obsidian 1-6
     导出: talkSend('canvas-export', {json}) */
  var LAYERS = {
    presentation:{label:'表现层',color:'#fb7185',canvas:'1'},
    application:{label:'应用层',color:'#fb923c',canvas:'2'},
    common:{label:'公共层',color:'#fbbf24',canvas:'3'},
    infrastructure:{label:'基础设施',color:'#34d399',canvas:'4'},
    stage:{label:'管道阶段',color:'#22d3ee',canvas:'5'},
    domain:{label:'领域层',color:'#a78bfa',canvas:'6'}
  };
  var DATA = (typeof window.__CANVAS__ !== 'undefined' && window.__CANVAS__) || {nodes:[],edges:[],groups:[]};
  var editor, hist=[], histIdx=-1, cidMap={};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function nodeHtml(name,layer,sub){
    var L=LAYERS[layer]||LAYERS.stage;
    return '<div class="anode">'
      +'<div class="anode-head"><span class="anode-dot"></span><span class="anode-name">'+esc(name)+'</span><span class="anode-layer">'+L.label+'</span><button class="anode-del" title="删除节点">×</button></div>'
      +'<div class="anode-sub">'+esc(sub||'')+'</div></div>';
  }
  function toast(msg){var t=document.getElementById('ed-toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2400);}
  function scheduleSave(){clearTimeout(scheduleSave._t);scheduleSave._t=setTimeout(function(){try{localStorage.setItem('talk-canvas-v1',JSON.stringify(editor.export()));}catch(e){}},600);}
  function pushHist(){
    var snap=JSON.stringify(editor.export());
    if(hist[histIdx]===snap)return;
    hist=hist.slice(0,histIdx+1);hist.push(snap);
    if(hist.length>80)hist.shift();
    histIdx=hist.length-1;
  }
  function mutate(fn){pushHist();fn();scheduleSave();updateCounts();}
  function undo(){if(histIdx>0){histIdx--;editor.import(JSON.parse(hist[histIdx]));updateCounts();}}
  function redo(){if(histIdx<hist.length-1){histIdx++;editor.import(JSON.parse(hist[histIdx]));updateCounts();}}
  function updateCounts(){
    var ex=editor.export(),d=ex.drawflow.Home.data,n=0,e=0,id;
    for(id in d){n++;var nd=d[id];for(var p in nd.outputs)e+=nd.outputs[p].connections.length;}
    var c=document.getElementById('ed-count');if(c)c.textContent=n+' 节点 · '+e+' 连线';
  }
  function dfIdToCid(dfId){
    var d=editor.drawflow.drawflow.Home.data[dfId];
    return (d&&d.data&&d.data.cid)||dfId;
  }
  function buildSummary(){
    var ex=editor.export(),d=ex.drawflow.Home.data;
    var nodes=[],edges=[],id;
    for(id in d){var nd=d[id];
      var meta=nd.data||{};
      nodes.push({id:meta.cid||String(id),name:meta.name||nd.name||('node-'+id),layer:meta.layer||'stage',sub:meta.sub||'',x:Math.round(nd.pos_x),y:Math.round(nd.pos_y),w:250,h:110});
      for(var p in nd.outputs){nd.outputs[p].connections.forEach(function(c){edges.push({from:dfIdToCid(id),to:dfIdToCid(c.node)});});}
    }
    return {version:2,exportedAt:new Date().toISOString(),title:DATA.title||'白板',canvasPath:DATA.canvasPath||'',viewport:DATA.viewport||{x:0,y:0,zoom:1},nodes:nodes,edges:edges,groups:(DATA.groups||[])};
  }
  function buildFromData(){
    var idMap={};
    (DATA.nodes||[]).forEach(function(nd){
      var layer=LAYERS[nd.layer]?nd.layer:'stage';
      var name=nd.name||'节点';
      var sub=nd.sub||'';
      var w=nd.w||250,h=nd.h||110;
      var html=nodeHtml(name,layer,sub);
      var id=editor.addNode(html,1,1,nd.x||100,nd.y||100,'layer-'+layer,{name:name,layer:layer,sub:sub,cid:nd.id},html,false);
      idMap[nd.id]=id;
      var nodeEl=document.getElementById('node-'+id);
      if(nodeEl){nodeEl.style.width=w+'px';nodeEl.style.minHeight=h+'px';}
    });
    (DATA.edges||[]).forEach(function(e){
      if(idMap[e.from]!=null&&idMap[e.to]!=null)editor.addConnection(idMap[e.from],idMap[e.to],'output_1','input_1');
    });
    renderGroups();
    return idMap;
  }
  function renderGroups(){
    var pc=editor.precanvas;
    pc.querySelectorAll('.cg-group').forEach(function(g){g.remove();});
    (DATA.groups||[]).forEach(function(g){
      var div=document.createElement('div');
      div.className='cg-group';
      div.style.left=g.x+'px';div.style.top=g.y+'px';
      div.style.width=g.width+'px';div.style.height=g.height+'px';
      div.innerHTML='<span class="cg-label">'+esc(g.label||'')+'</span>';
      pc.appendChild(div);
    });
  }
  function addNewNode(layer,name){
    var L=LAYERS[layer]||LAYERS.stage;
    var n=name||('新'+L.label+'节点');
    var x=260+Math.round(Math.random()*800),y=300+Math.round(Math.random()*420);
    mutate(function(){
      var nh=nodeHtml(n,layer,'双击标题改名 · 双击此行写备注');
      var id=editor.addNode(nh,1,1,x,y,'layer-'+layer,{name:n,layer:layer,sub:'双击标题改名 · 双击此行写备注',cid:'n-'+Date.now()},nh,false);
    });
  }
  function initEditor(){
    editor=new Drawflow(document.getElementById('drawflow'));
    editor.start();
    var vz=(DATA.viewport&&DATA.viewport.zoom)||0.85;
    editor.zoom=Math.min(1.2,Math.max(0.5,vz));editor.zoom_refresh();
    editor.on('nodeCreated',function(){scheduleSave();updateCounts();});
    editor.on('nodeRemoved',function(){scheduleSave();updateCounts();});
    editor.on('connectionCreated',function(){scheduleSave();updateCounts();});
    editor.on('connectionRemoved',function(){scheduleSave();updateCounts();});
    var saved=null;try{saved=JSON.parse(localStorage.getItem('talk-canvas-v1')||'null');}catch(e){}
    if(saved&&saved.drawflow&&saved.drawflow.Home&&Object.keys(saved.drawflow.Home.data).length){
      editor.import(saved);toast('已恢复上次编辑（可用 ♻️ 重置）');
    }else{
      buildFromData();pushHist();toast('已加载白板，开始编辑吧');
    }
    updateCounts();
    var tt=document.getElementById('ed-title');if(tt&&DATA.title)tt.textContent=DATA.title;
    var st=document.getElementById('ed-subtitle');
    if(st&&DATA.canvasPath){st.textContent='同步于 '+DATA.canvasPath;}
  }
  function load(){
    var t0=Date.now();
    var iv=setInterval(function(){
      if(typeof window.Drawflow!=='undefined'){clearInterval(iv);initEditor();}
      else if(Date.now()-t0>5000){clearInterval(iv);toast('Drawflow 库加载失败，请检查网络后刷新');}
    },100);
  }
  document.addEventListener('DOMContentLoaded',load);
  document.addEventListener('mouseup',function(){if(editor){pushHist();scheduleSave();}});
  document.getElementById('ed-root').addEventListener('click',function(ev){
    var del=ev.target.closest('.anode-del');
    if(del){var nodeEl=ev.target.closest('.drawflow-node');if(nodeEl){mutate(function(){editor.removeNodeId(nodeEl.id);});}return;}
  });
  function togglePop(id){
    var p=document.getElementById(id);if(!p)return;
    var was=p.hidden;p.hidden=!was;
    if(!p.hidden&&id==='add-pop'){document.getElementById('pop-name').focus();}
  }
  document.getElementById('btn-add').addEventListener('click',function(){togglePop('add-pop');});
  document.getElementById('btn-undo').addEventListener('click',undo);
  document.getElementById('btn-redo').addEventListener('click',redo);
  document.getElementById('btn-del').addEventListener('click',function(){
    if(!editor)return;
    var selEl=editor.node_selected;
    if(selEl){mutate(function(){editor.removeNodeId(selEl.id);});}else{toast('先点选一个节点');}
  });
  document.getElementById('btn-zoomout').addEventListener('click',function(){if(editor)editor.zoom_out();});
  document.getElementById('btn-zoomin').addEventListener('click',function(){if(editor)editor.zoom_in();});
  document.getElementById('btn-fit').addEventListener('click',function(){if(!editor)return;editor.zoom=0.75;editor.canvas_x=0;editor.canvas_y=0;editor.zoom_refresh();});
  document.getElementById('btn-reset').addEventListener('click',function(){
    if(confirm('重置为初始白板？（清除当前编辑内容与浏览器暂存）')){
      try{localStorage.removeItem('talk-canvas-v1');}catch(e){}
      editor.clear();hist=[];histIdx=-1;buildFromData();pushHist();updateCounts();toast('已重置为初始白板');
    }
  });
  document.getElementById('btn-export').addEventListener('click',function(){
    if(!editor){toast('编辑器未初始化（库加载失败），请刷新');return;}
    var s=buildSummary(),json=JSON.stringify(s,null,2);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(json).catch(function(){});}
    var sent=false;
    if(typeof window.talkSend==='function'){window.talkSend('canvas-export',{json:json});sent=true;}
    toast(sent?'已发送给 agent ✅（将写回 .canvas 文件）':'图已复制到剪贴板（talkSend 不可用）');
  });
  var pl=document.getElementById('pop-layers');
  Object.keys(LAYERS).forEach(function(k){
    var b=document.createElement('button');b.className='p-layer';
    b.innerHTML='<i style="background:'+LAYERS[k].color+'"></i>'+LAYERS[k].label;
    b.addEventListener('click',function(){addNewNode(k);togglePop('add-pop');});
    pl.appendChild(b);
  });
  document.getElementById('pop-add').addEventListener('click',function(){
    var n=document.getElementById('pop-name').value.trim();
    var l=document.getElementById('pop-layer-sel').value;
    addNewNode(l,n||null);
    document.getElementById('pop-name').value='';
    togglePop('add-pop');
  });
  document.getElementById('pop-name').addEventListener('keydown',function(e){if(e.key==='Enter'){document.getElementById('pop-add').click();}});
  document.getElementById('ed-root').addEventListener('dblclick',function(ev){
    var nameEl=ev.target.closest('.anode-name'),subEl=ev.target.closest('.anode-sub');
    if(!nameEl&&!subEl)return;
    var nodeEl=ev.target.closest('.drawflow-node');if(!nodeEl||!editor)return;
    var nid=nodeEl.id.replace('node-','');
    var live=editor.drawflow.drawflow.Home.data[nid]; // getNodeFromId 返回深拷贝，须直接改内部状态
    if(nameEl){
      var nn=prompt('节点名称：',live.data.name);
      if(nn&&nn.trim()){mutate(function(){live.data.name=nn.trim();nameEl.textContent=nn.trim();live.html=nodeHtml(live.data.name,live.data.layer,live.data.sub);});}
    }else{
      var ns=prompt('描述 / 备注：',live.data.sub||'');
      if(ns!==null){mutate(function(){live.data.sub=ns;subEl.textContent=ns;live.html=nodeHtml(live.data.name,live.data.layer,live.data.sub);});}
    }
  });
  window.addEventListener('keydown',function(e){
    if(!editor)return;
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
    if(e.key==='Delete'||e.key==='Backspace'){var selEl=editor.node_selected;if(selEl){e.preventDefault();mutate(function(){editor.removeNodeId(selEl.id);});}}
  });
  document.getElementById('drawflow').addEventListener('mousedown',function(){var p=document.getElementById('add-pop');if(!p.hidden)p.hidden=true;});
})();
</script>
</body>
</html>
